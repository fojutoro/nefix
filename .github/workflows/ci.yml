name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          # Without this it looks for go.sum at the repo root, finds
          # nothing, and silently caches neither modules nor build output.
          cache-dependency-path: server/go.sum
      # make go-lint installs staticcheck with `go install`, which compiles
      # it from source and costs ~50s of the ~58s this job spends linting.
      # The key must match STATICCHECK_VERSION in the Makefile — bump both.
      - uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: staticcheck-${{ runner.os }}-v0.7.0
      - run: make go-lint
      - run: make go-test
      - run: make build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # setup-node's cache holds the npm download cache, so `npm ci` still
      # unpacks and links every package. Caching node_modules itself skips
      # the install entirely on a hit.
      - uses: actions/cache@v4
        id: node-modules
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: make web-install
      - run: make web-lint
      - run: make web-test
      - run: make web-build